<!DOCTYPE html>
<html lang="nb">
<head>
    <meta charset="UTF-8">
    <title>Kommer det post i dag?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 1rem;
        }
        h1 { margin-bottom: 1rem; }
        .result { 
            padding: 1rem; 
            background: #f3f3f3; 
            border-radius: 6px; 
            font-size: 1.2rem;
        }
        .ja { color: green; font-weight: bold; }
        .nei { color: red; font-weight: bold; }
    </style>
</head>
<body>

<h1>Kommer det post i dag?</h1>
<div class="result" id="resultat"></div>

<script>
    function getQueryParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    function erVirkedag(dato) {
        const d = dato.getDay();
        return d >= 1 && d <= 5; // man–fre
    }

    // Demo-logikk:
    // Partall → levering man, ons, fre
    // Oddetall → levering tir, tor
    function hentLeveringsdager(postnummer) {
        const siste = parseInt(postnummer.slice(-1), 10);
        const erPartall = (siste % 2 === 0);

        return erPartall
            ? [1, 3, 5]   // man, ons, fre
            : [2, 4];     // tir, tor
    }

    function ukedagNavn(dag) {
        return ["sø.", "ma.", "ti.", "on.", "to.", "fr.", "lø."][dag];
    }

    function visResultat() {
        const resultat = document.getElementById("resultat");
        const postnummer = getQueryParam("postnummer");

        if (!postnummer || !/^\d{4}$/.test(postnummer)) {
            resultat.innerHTML = "Ugyldig eller manglende postnummer i URL.";
            return;
        }

        const iDag = new Date();
        const dag = iDag.getDay();
        const leveringsdager = hentLeveringsdager(postnummer);

        const kommerIDag = erVirkedag(iDag) && leveringsdager.includes(dag);

        const svar = kommerIDag ? 
            '<span class="ja">JA</span>' : 
            '<span class="nei">NEI</span>';

        const dagerTekst = leveringsdager.map(d => ukedagNavn(d)).join(", ");

        resultat.innerHTML = `
            <strong>Postnummer:</strong> ${postnummer}<br><br>
            ${svar}<br><br>
            Leveringsdager denne uken: ${dagerTekst}
        `;
    }

    visResultat();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live Power Usage</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #value { font-size: 3rem; font-weight: bold; }
    #time { color: #666; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>Live Power Usage</h1>
  <div id="value">Loading…</div>
  <div id="value2">Loading…</div>
  <div id="time"></div>
  <h2>Hourly Averages (Last 24 Hours)</h2>
  <ul id="hourly-list"></ul>


  <script>
  const SUPABASE_URL = "https://oaovqgtflljlqlacckhh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_wcA2Vovx12LzSD-2zPJICQ_yW0QJGLs";

  async function fetchLatest() {
    const now = new Date();
    now.setUTCMinutes(0, 0, 0);
    const lastHourUTC = new Date(now.getTime()).toISOString();
    const url = `${SUPABASE_URL}/rest/v1/power_readings?select=*&timestamp=gte.${lastHourUTC}&order=timestamp.desc&limit=2000`;

    try {
      const res = await fetch(url, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });

      const data = await res.json();
      if (data.length > 0) {
        const reading = data[0];
        document.getElementById("value").textContent = reading.watts + " W";
        document.getElementById("value2").textContent =
          "Hourly average: " +
          (data.reduce((sum, r) => sum + Number(r.watts), 0) / data.length).toFixed(1) +
          " W";
        document.getElementById("time").textContent =
          "Updated: " + new Date(reading.timestamp).toLocaleString();
      }
    } catch (err) {
      console.error("Fetch error:", err);
    }
  }
  async function fetch24hAverages() {
    const now = new Date();

    // End at the current hour (e.g., 21:00 if it's 21:19)
    const endHour = new Date(now);
    endHour.setMinutes(0, 0, 0);

    // Start 24 hours before that
    const startHour = new Date(endHour.getTime() - 24 * 60 * 60 * 1000);

    const url =
      `${SUPABASE_URL}/rest/v1/power_readings` +
      `?select=*` +
      `&timestamp=gte.${startHour.toISOString()}` +
      `&timestamp=lt.${endHour.toISOString()}` +
      `&order=timestamp.asc` +
      `&limit=1000`;

    const res = await fetch(url, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });

    const data = await res.json();

    // Prepare 24 buckets (0 = oldest hour, 23 = latest hour)
    const buckets = Array.from({ length: 24 }, () => []);

    // Sample every 10th reading
    for (let i = 0; i < data.length; i += 10) {
      const r = data[i];
      const ts = new Date(r.timestamp);

      const diffMs = ts.getTime() - startHour.getTime();
      const hourIndex = Math.floor(diffMs / (60 * 60 * 1000));

      if (hourIndex >= 0 && hourIndex < 24) {
        buckets[hourIndex].push(Number(r.watts));
      }
    }

    const list = document.getElementById("hourly-list");
    list.innerHTML = "";

    // Output from newest → oldest
    for (let i = 23; i >= 0; i--) {
      const bucketStart = new Date(startHour.getTime() + i * 60 * 60 * 1000);
      const bucketEnd = new Date(bucketStart.getTime() + 60 * 60 * 1000);

      const label =
        bucketStart.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
        " - " +
        bucketEnd.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      const readings = buckets[i];
      let text;

      if (readings.length === 0) {
        text = `${label} — no data`;
      } else {
        const avg = readings.reduce((a, b) => a + b, 0) / readings.length;
        text = `${label} — ${avg.toFixed(1)} W`;
      }

      const li = document.createElement("li");
      li.textContent = text;
      list.appendChild(li);
    }
  }


  fetchLatest();
  fetch24hAverages();

  setInterval(fetchLatest, 10000);
  </script>


</body>
</html>

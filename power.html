<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live Power Usage</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #value { font-size: 3rem; font-weight: bold; }
    #time { color: #666; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>Live Power Usage</h1>
  <div id="value">Loading…</div>
  <div id="value2">Loading…</div>
  <div id="time"></div>
  <h2>Hourly Averages (Last 24 Hours)</h2>
  <ul id="hourly-list"></ul>


  <script>
  const SUPABASE_URL = "https://oaovqgtflljlqlacckhh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_wcA2Vovx12LzSD-2zPJICQ_yW0QJGLs";

  async function fetchLatest() {
    const now = new Date();
    now.setUTCMinutes(0, 0, 0);
    const lastHourUTC = new Date(now.getTime()).toISOString();
    const url = `${SUPABASE_URL}/rest/v1/power_readings?select=*&timestamp=gte.${lastHourUTC}&order=timestamp.desc&limit=2000`;

    try {
      const res = await fetch(url, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });

      const data = await res.json();
      if (data.length > 0) {
        const reading = data[0];
        document.getElementById("value").textContent = reading.watts + " W";
        document.getElementById("value2").textContent =
          "Hourly average: " +
          (data.reduce((sum, r) => sum + Number(r.watts), 0) / data.length).toFixed(1) +
          " W";
        document.getElementById("time").textContent =
          "Updated: " + new Date(reading.timestamp).toLocaleString();
      }
    } catch (err) {
      console.error("Fetch error:", err);
    }
  }

  async function fetch24hAverages() {
    const now = new Date();
    const since = new Date(now.getTime() - 24 * 60 * 60 * 1000).toISOString();

    const url = `${SUPABASE_URL}/rest/v1/power_readings?select=*&timestamp=gte.${since}&order=timestamp.asc&limit=50000`;

    try {
      const res = await fetch(url, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });

      const data = await res.json();

      // Group readings by hour
      const buckets = {};
      data.forEach(r => {
        const ts = new Date(r.timestamp);
        const hourKey = ts.getFullYear() + "-" +
                        (ts.getMonth()+1).toString().padStart(2,"0") + "-" +
                        ts.getDate().toString().padStart(2,"0") + " " +
                        ts.getHours().toString().padStart(2,"0") + ":00";

        if (!buckets[hourKey]) buckets[hourKey] = [];
        buckets[hourKey].push(Number(r.watts));
      });

      // Compute averages
      const sortedHours = Object.keys(buckets).sort();
      const list = document.getElementById("hourly-list");
      list.innerHTML = "";

      sortedHours.forEach(hour => {
        const arr = buckets[hour];
        const avg = arr.reduce((a, b) => a + b, 0) / arr.length;

        const li = document.createElement("li");
        li.textContent = `${hour} — ${avg.toFixed(1)} W`;
        list.appendChild(li);
      });

    } catch (err) {
      console.error("Fetch error:", err);
    }
  }

  fetchLatest();
  fetch24hAverages();

  setInterval(fetchLatest, 10000);
  </script>


</body>
</html>

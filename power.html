<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Live Power Usage</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #value { font-size: 3rem; font-weight: bold; }
    #time { color: #666; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>Live Power Usage</h1>
  <div id="value">Loading…</div>
  <div id="value2">Loading…</div>
  <div id="time"></div>
  <h2>Hourly Averages (Last 24 Hours)</h2>
  <ul id="hourly-list"></ul>


  <script>
  const SUPABASE_URL = "https://oaovqgtflljlqlacckhh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_wcA2Vovx12LzSD-2zPJICQ_yW0QJGLs";

  async function fetchLatest() {
    const now = new Date();
    now.setUTCMinutes(0, 0, 0);
    const lastHourUTC = new Date(now.getTime()).toISOString();
    const url = `${SUPABASE_URL}/rest/v1/power_readings?select=*&timestamp=gte.${lastHourUTC}&order=timestamp.desc&limit=2000`;

    try {
      const res = await fetch(url, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });

      const data = await res.json();
      if (data.length > 0) {
        const reading = data[0];
        document.getElementById("value").textContent = reading.watts + " W";
        document.getElementById("value2").textContent =
          "Hourly average: " +
          (data.reduce((sum, r) => sum + Number(r.watts), 0) / data.length).toFixed(1) +
          " W";
        document.getElementById("time").textContent =
          "Updated: " + new Date(reading.timestamp).toLocaleString();
      }
    } catch (err) {
      console.error("Fetch error:", err);
    }
  }
  async function fetch24hAverages() {
    const now = new Date();

    // Last completed hour (e.g., 21:19 → 21:00)
    const endHour = new Date(now);
    endHour.setMinutes(0, 0, 0);

    const list = document.getElementById("hourly-list");
    list.innerHTML = "";

    // Loop 24 hours backwards
    for (let i = 1; i <= 24; i++) {
      const hourEnd = new Date(endHour.getTime() - (i - 1) * 60 * 60 * 1000);
      const hourStart = new Date(hourEnd.getTime() - 60 * 60 * 1000);

      const url =
        `${SUPABASE_URL}/rest/v1/power_readings` +
        `?select=watts,timestamp` +
        `&timestamp=gte.${hourStart.toISOString()}` +
        `&timestamp=lt.${hourEnd.toISOString()}` +
        `&order=timestamp.asc` +
        `&limit=1000`;

      const res = await fetch(url, {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      });

      const rows = await res.json();

      // Compute average
      let text;
      if (rows.length === 0) {
        text = "no data";
      } else {
        const avg =
          rows.reduce((sum, r) => sum + Number(r.watts), 0) / rows.length;
        text = avg.toFixed(1) + " W";
      }

      // Format label
      const label =
        hourStart.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
        " - " +
        hourEnd.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      // Add to list
      const li = document.createElement("li");
      li.textContent = `${label} — ${text}`;
      list.appendChild(li);
    }
  }


  fetchLatest();
  fetch24hAverages();

  setInterval(fetchLatest, 10000);
  </script>


</body>
</html>
